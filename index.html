          ${tag('已核发','green')}
          <div style="margin-top:8px;display:flex;gap:6px">
            <button class="btn sm" data-act="toastDemo" data-msg="证书 PDF 已下载">下载</button>
            <button class="btn sm" data-act="toastDemo" data-msg="已跳转随申办电子证照">随申办查看</button>
          </div>
        </div>
      </div>`).join('') : empty('还没有通过免试认定获得证书'), {sub:'人社已读后核发'})}

    <div class="grid" style="grid-template-columns:1fr 1fr">
      ${card('证书验真', `
        <div class="field"><label>证书编号</label><input type="text" placeholder="输入证书编号，如 SH2026J4001024"></div>
        <div class="field"><label>验真码</label><input type="text" placeholder="证书右下角 8 位验真码"></div>
        <button class="btn primary" data-act="toastDemo" data-msg="验真通过：证书真实有效">立即验真</button>
        <div class="box grey" style="margin-top:10px;font-size:12.5px">任何用人单位均可通过本入口或随申办核验证书真伪。</div>`, {})}
      ${card('证书用途', `
        <ul style="margin:0;padding-left:18px;font-size:12.8px;color:var(--ink-2);line-height:2">
          <li>可作为技能人才评价、岗位聘任、薪酬定级的依据</li>
          <li>可按规定申领职业技能提升补贴</li>
          <li>可作为积分落户、人才引进的技能等级佐证</li>
          <li>纳入本市技能人才统计库，享受相关公共服务</li>
        </ul>`, {})}
    </div>`;
  };

  /* ---------- 添加证书（保存到本地） ---------- */
  ACT.addCertDrawer = (name)=>{
    const pre = DB.pairs.find(p=>p.src===name) || matchPairByText(name);
    drawer('添加我持有的证书',
      `<div class="box info" style="margin-bottom:14px">证书名称可从下拉选择（自动带出发证机构与证书类型），也可<b>直接手工输入</b>其他证书。保存后先存到本机，同时提交上海外服核验证书真伪。</div>
       <div class="field"><label>证书名称<span class="req">*</span>　<span style="font-weight:400;color:var(--ink-4);font-size:11.5px">可输入，也可下拉选择</span></label>
         ${certCombo('newCertName', name||'', {ph:'如 HCIA-Datacom、AZ-104，或其他证书名称'})}
         <div class="mini" id="newCertTip" style="margin-top:6px">${pre?`将按「${esc(pre.src)}」登记，可免试换 ${esc(pre.tgt)} · ${esc(pre.tgtLevel)}`:'选择目录型号可自动带出发证机构与证书类型'}</div>
       </div>
       <div class="f-row">
         <div class="field"><label>证书编号<span class="req">*</span></label><input id="newCertNo" type="text" placeholder="证书上的编号，如 HCIA-DATACOM-2024-088412"></div>
         <div class="field"><label>发证机构</label><input id="newCertOrg" type="text" value="${esc(pre?pre.srcOrg:'')}" placeholder="如 华为技术有限公司"></div>
       </div>
       <div class="f-row">
         <div class="field"><label>发证日期<span class="req">*</span></label><input id="newCertDate" type="month" value="2024-06"></div>
         <div class="field"><label>有效期至</label><input id="newCertValid" type="month" value="2027-06"></div>
       </div>
       <div class="f-row">
         <div class="field"><label>证书类型</label><select id="newCertType">${['厂商认证','国际认证','国家职业资格','行业认证','其他'].map(t=>`<option ${pre&&pre.srcType===t?'selected':''}>${t}</option>`).join('')}</select></div>
         <div class="field"><label>发证国家 / 地区</label><input type="text" value="中国"></div>
       </div>
       <div class="upload">＋ 上传证书扫描件（含编号页，PDF / JPG，单个 ≤10MB）</div>
       <div class="file-item">待上传<span class="fs">必传</span></div>
       <div class="box warn" style="margin-top:10px">保存后证书会留在本机「我的证书」中；核验通过前可查询，但不能据此提交申请。</div>`,
      `<button class="btn" data-act="closeDrawer">取消</button>
       <button class="btn primary" data-act="saveCert">保存到本地并提交核验</button>`);
  };

  ACT.saveCert = ()=>{
    const name = (document.getElementById('newCertName').value||'').trim();
    const no   = (document.getElementById('newCertNo').value||'').trim();
    const org  = (document.getElementById('newCertOrg').value||'').trim();
    const d    = document.getElementById('newCertDate').value;
    const v    = document.getElementById('newCertValid').value;
    const type = document.getElementById('newCertType').value;
    if(!name) return toast('请填写或选择证书名称', 'err');
    if(!no)   return toast('请填写证书编号', 'err');
    if(DB.myCerts.some(c=>String(c.no).toUpperCase()===no.toUpperCase())) return toast('该证书编号已登记，请勿重复添加', 'err');

    const rec = {
      no, name, org: org||'—', type,
      date: d ? d+'-01' : '—',
      validTo: v ? v+'-01' : '长期有效',
      status:'有效', verified:false, file:'证书扫描件.pdf', local:true
    };
    DB.myCerts.unshift(rec);
    persist();
    const mi = matchInfo(rec);
    closeDrawer(); render();
    if(mi.st==='on')
      toast(`证书已保存到本地，可免试换「${mi.p.tgt} · ${mi.p.tgtLevel}」；外服核验通过后即可发起`, 'ok');
    else
      toast('证书已保存到本地。该型号在免试目录中暂无对应证书，需外服先建立对应关系', 'ok');
  };

  ACT.delCert = (no)=>{
    const c = DB.myCerts.find(x=>x.no===no); if(!c) return;
    drawer('移除证书',
      `<div class="box warn">确认移除「${esc(c.name)}」？移除后该证书不再参与免试资格查询，也不再保存在本机；已提交的申请不受影响。</div>
       <div class="mini" style="margin-top:10px">证书编号 ${mono(c.no)}</div>`,
      `<button class="btn" data-act="closeDrawer">取消</button>
       <button class="btn danger" data-act="doDelCert" data-v="${esc(no)}">确认移除</button>`);
  };
  ACT.doDelCert = (no)=>{
    const i = DB.myCerts.findIndex(x=>x.no===no);
    if(i<0) return;
    DB.myCerts.splice(i,1);
    persist();
    closeDrawer(); render(); toast('证书已移除，本地保存已同步更新', 'ok');
  };

  /* ---------- 匹配情况 ---------- */
  ACT.certMatch = (no)=>{
    const c = DB.myCerts.find(x=>x.no===no); if(!c) return;
    const mi = matchInfo(c), p = mi.p;
    const exp = isExpired(c), pend = c.verified===false;

    let body = `<div class="mini" style="margin-bottom:12px">${mono(c.no)}　${esc(c.org)}　有效期至 ${esc(c.validTo)}</div>
      <div class="mstep"><span class="n">1</span><div><b>按证书型号检索《免试对应目录》</b>
        <div class="mini">${mi.st==='none'
          ? `未找到与「${esc(c.name)}」匹配的型号`
          : `命中 <b>${esc(p.id)}</b>：${esc(p.src)} → ${esc(p.tgt)} · ${esc(p.tgtLevel)}`}</div></div></div>
      <div class="mstep"><span class="n">2</span><div><b>对应关系状态</b>
        <div class="mini">${mi.st==='on'?'生效（2026-09-12 起执行）':mi.st==='off'?`已停用：${esc(p.memo||'—')}`:'无对应关系'}</div></div></div>`;

    if(mi.st==='on'){
      const rows = condRows(p, DB.me.socMonths, DB.me.edu, certYears(c), exp);
      const ok = verdictOf(rows);
      body += `<div class="mstep"><span class="n">3</span><div><b>我的条件核对</b>
          <div class="mini">社保 ${DB.me.socMonths} 个月 / 持证 ${certYears(c)} 年 / 学历 ${esc(DB.me.edu)}</div></div></div>
        <div class="divider"></div>
        ${condBlock(rows)}
        <div class="box ${ok&&!pend?'ok':'warn'}" style="margin-top:12px">
          ${pend ? '证书仍待上海外服核验，核验通过后即可发起免试申请。'
            : ok ? '条件符合，可凭此证书发起免试认定申请。'
            : '存在不符项，补齐后再发起申请。'}
        </div>`;
    } else {
      body += `<div class="mstep"><span class="n">3</span><div><b>结论</b>
          <div class="mini">该证书型号目前没有可换取的另一本职业技能等级证书，<b>不能发起免试申请</b>。
          这不是您的材料问题，而是外服尚未在目录中建立该型号与其他证书的 1 对 1 对应关系。</div></div></div>
        <div class="divider"></div>
        <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px;font-weight:600">目录中已收录的型号（可参考）</div>
        ${table(['源证书型号','可免试换','条件'], DB.pairs.filter(x=>x.status==='生效').slice(0,5).map(x=>[
          esc(x.src), `${esc(x.tgt)} · ${esc(x.tgtLevel)}`,
          `<span class="mini">社保 ${x.socMonths} 个月 / ${esc(x.edu)}</span>`]), {tight:true})}
        <div class="box grey" style="margin-top:10px;font-size:12.5px">如您认为该证书应当纳入免试范围，可提交目录纳入评估申请，由上海外服审核后决定是否建立对应关系。</div>`;
    }

    drawer('匹配情况 · ' + c.no, body,
      `<button class="btn" data-act="closeDrawer">关闭</button>
       ${mi.st!=='on'&&!c.pairReq?`<button class="btn primary" data-act="requestPair" data-v="${esc(c.no)}">申请纳入目录</button>`:''}
       ${mi.st==='on'&&!exp&&!pend?`<button class="btn primary" data-act="pickApply" data-v="${esc(c.name)}">发起免试认证</button>`:''}`);
  };

  /* ---------- 申请把证书纳入目录（1 对 1 对应关系由外服决定） ---------- */
  ACT.requestPair = (no)=>{
    const c = DB.myCerts.find(x=>x.no===no); if(!c) return;
    c.pairReq = true;
    c.pairReqAt = stamp();
    persist();
    closeDrawer(); render();
    toast(`已提交「${c.name}」目录纳入评估，上海外服 5 个工作日内答复`, 'ok');
  };

  /* ---------- 清空本地保存 ---------- */
  ACT.resetCerts = ()=>{
    drawer('清空本地保存的证书',
      `<div class="box warn">将清空本机保存的全部证书（共 ${DB.myCerts.length} 张），刷新后恢复为演示预置数据。</div>
       <div class="mini" style="margin-top:10px">清空只影响本机浏览器中的记录，不影响已提交的申请与已核发的证书。</div>`,
      `<button class="btn" data-act="closeDrawer">取消</button>
       <button class="btn danger" data-act="doResetCerts">确认清空</button>`);
  };
  ACT.doResetCerts = ()=>{
    try{ if(LS) LS.removeItem(LS_KEY); }catch(e){}
    savedAt = '';
    closeDrawer();
    if(typeof location!=='undefined' && location.reload) location.reload();
    else { render(); toast('本地数据已清空', 'ok'); }
  };

  /* ---------- 证书详情 ---------- */
  ACT.certDetail = (no)=>{
    const c = DB.myCerts.find(x=>x.no===no); if(!c) return;
    const mi = matchInfo(c), p = mi.p;
    drawer('证书详情 · ' + c.no,
      `<div style="display:flex;gap:8px;margin-bottom:12px">
         ${c.verified===false?tag('待外服核验','orange'):tag('已核验','green')}
         ${isExpired(c)?tag('已过期','grey'):tag('有效','green')}
         ${mi.st==='on'?tag('目录已匹配','blue'):tag('无对应证书','grey')}
         ${c.local?tag('本地保存','grey'):''}</div>
       ${kv([['证书名称',esc(c.name)],['证书编号',mono(c.no)],['发证机构',esc(c.org)],['证书类型',esc(c.type)],
         ['发证日期',esc(c.date)],['有效期至',esc(c.validTo)],['扫描件',mono(c.file||'—')],
         ['保存位置','本机浏览器（localStorage）'],['保存时间',esc(savedAt||'—')]])}
       ${mi.st==='on'?`<div class="divider"></div>
         <div class="pair-arrow" style="margin:0 0 10px">
           <span class="src">${esc(c.name)}</span><span class="ar">→ 免试 →</span><span class="tgt">${esc(p.tgt)} · ${esc(p.tgtLevel)}</span></div>
         ${table(['条件','要求'],[
           ['上海社保缴纳', p.socMonths+' 个月及以上'],
           ['持证年限', (p.years||'不限')+' 年'],
           ['学历', esc(p.edu)],
           ['附加条件', esc(p.extra)],
         ])}`:`<div class="box warn" style="margin-top:12px">该证书型号在《免试对应目录》中暂无对应关系，无法发起免试申请${c.pairReq?'（已提交纳入评估）':'，可申请纳入评估'}。</div>`}
       <div class="divider"></div>
       <div class="box grey" style="font-size:12.5px"><b>核验方式：</b>
         ${c.verified===false?'待核验 —— 将通过原厂 API 或官方渠道人工查验，证据哈希存证。':'官方渠道已核验，回执与证据文件已归档。'}</div>`,
      `<button class="btn" data-act="closeDrawer">关闭</button>
       <button class="btn danger" data-act="delCert" data-v="${esc(c.no)}">移除</button>
       ${mi.st==='on'&&!isExpired(c)&&c.verified!==false?`<button class="btn primary" data-act="pickApply" data-v="${esc(c.name)}">发起免试认证</button>`:
         mi.st!=='on'&&!c.pairReq?`<button class="btn primary" data-act="requestPair" data-v="${esc(c.no)}">申请纳入目录</button>`:''}`);
  };

  /* ---------- 下拉输入框交互 ---------- */
  function resetCombo(inp){
    const w = inp.closest('.combo'); if(!w) return;
    w.querySelectorAll('.combo-opt').forEach(o=>o.classList.remove('hide'));
    w.querySelectorAll('.combo-grp').forEach(g=>{ g.style.display=''; });
    const emp = w.querySelector('.combo-empty'); if(emp) emp.style.display='none';
  }
  function updateCertHint(inp){
    const host = document.getElementById('qHint'); if(!host) return;
    const text = (inp.value||'').trim();
    if(!text){ host.style.display='none'; return; }
    const cert = findMyCert(text);
    const pair = (inp.dataset.pair && DB.pairs.find(p=>p.id===inp.dataset.pair))
              || certPairOf(cert) || matchPairByText(text);
    host.style.display = 'block';
    if(pair && pair.status==='生效'){
      host.className = 'combo-hint ok';
      host.innerHTML = `${cert?'✓ 已匹配我的证书':'✓ 已匹配目录型号'} → 可免试换 <b>${esc(pair.tgt)} · ${esc(pair.tgtLevel)}</b>`;
    } else if(pair){
      host.className = 'combo-hint no';
      host.innerHTML = `! 该型号的对应关系已停用 → 暂不可发起，可申请纳入评估`;
    } else {
      host.className = 'combo-hint no';
      host.innerHTML = `! 《免试对应目录》无此型号 → 暂无对应的可免试证书，可申请纳入评估`;
    }
  }
  window.__updateCertHint = updateCertHint;

  ACT.comboPick = (v, el)=>{
    const w = el.closest('.combo'); if(!w) return;
    const inp = w.querySelector('.combo-in');
    const it = comboOptions().all[Number(v)]; if(!it) return;
    inp.value = it.label;
    inp.dataset.pair = it.pair ? it.pair.id : '';
    w.classList.remove('open');
    if(inp.id==='qCert') updateCertHint(inp);
    if(inp.id==='applyCert'){ state.applyCert = it.label; render(); }
    if(inp.id==='newCertName'){
      const org = document.getElementById('newCertOrg');
      if(org && it.pair) org.value = it.pair.srcOrg;
      const typ = document.getElementById('newCertType');
      if(typ && it.pair) typ.value = it.pair.srcType;
      const tip = document.getElementById('newCertTip');
      if(tip) tip.innerHTML = it.pair
        ? `✓ 已匹配目录型号，可免试换 <b>${esc(it.pair.tgt)} · ${esc(it.pair.tgtLevel)}</b>`
        : `<span style="color:#A5660A">该型号未纳入免试目录，保存后需申请建立对应关系</span>`;
    }
  };

  document.addEventListener('focusin', e=>{
    const inp = e.target.closest ? e.target.closest('.combo-in') : null;
    if(!inp) return;
    inp.closest('.combo').classList.add('open');
    resetCombo(inp);
  });
  document.addEventListener('input', e=>{
    const inp = e.target.closest ? e.target.closest('.combo-in') : null;
    if(!inp) return;
    inp.dataset.pair = '';
    inp.closest('.combo').classList.add('open');
    filterCombo(inp);
    if(inp.id==='qCert') updateCertHint(inp);
    if(inp.id==='newCertName'){
      const tip = document.getElementById('newCertTip');
      if(tip && !inp.value.trim()) tip.innerHTML = '选择目录型号可自动带出发证机构与证书类型';
    }
  });
  document.addEventListener('click', e=>{
    if(!(e.target.closest && e.target.closest('.combo')))
      document.querySelectorAll('.combo.open').forEach(x=>x.classList.remove('open'));
  });
})();

</script>
<script>
/* ==================================================================
   市人社局端（只读）
   唯一功能：查询上海外服「核验通过」的免试认定记录 + 标记已读
   ================================================================== */
(function(){

const G = PAGES.gov;

/* 外服已作出核验通过结论的记录（含已导出报送、人社已读） */
const PASS_ST = ['核验通过','已导出待接收','人社已读'];
const govList = () => DB.apps.filter(a=>PASS_ST.indexOf(a.status)>=0);
const GOV_PAGE_SIZE = 8;

const PHASE = {all:'全部', wait:'待外服导出', sent:'已报送待接收', read:'人社已读'};

function phaseOf(a){
  return a.status==='核验通过' ? 'wait' : a.status==='已导出待接收' ? 'sent' : 'read';
}
function phaseTag(a){
  const p = phaseOf(a);
  if(p==='wait') return tag('待外服导出','orange');
  if(p==='sent') return tag('已报送 · 待接收','blue');
  return tag('人社已读','green');
}
function gHay(a){
  return [a.no,a.name,a.company,a.srcCert,a.srcNo,a.srcOrg,a.tgtJob,a.tgtLevel,a.batch,a.verifier]
    .join(' ').toLowerCase();
}
function inView(a){
  const ph = tabState.gPassTab || 'all';
  if(ph!=='all' && phaseOf(a)!==ph) return false;
  return true;
}

/* ---------- 表格 ---------- */
function gTable(list){
  const cols = ['申报编号','姓名 / 单位','已持证书','拟认定职业（等级）','核验结论','报送批次','接收状态','操作'];
  const rows = list.map(a=>{
    const sent = a.batch && a.batch!=='—';
    return {k:gHay(a), c:[
      `<span class="link" data-act="openApp" data-v="${a.no}">${a.no}</span>`,
      `<b class="nw">${esc(a.name)}</b><br><span class="mini">${esc(a.company)}</span>`,
      `<span class="mini" title="${esc(a.srcCert)}">${esc(a.srcCert.length>22?a.srcCert.slice(0,22)+'…':a.srcCert)}</span><br><span class="mini" style="color:#8A9AAC">${esc(a.srcNo)}</span>`,
      `${esc(a.tgtJob)}<br><span class="mini">${esc(a.tgtLevel)}</span>`,
      `<span style="color:#0B7A55;font-weight:600">核验通过</span><br><span class="mini">${esc(a.verifyAt)}　${esc(a.verifier)}</span>`,
      sent ? mono(a.batch) : '<span class="mini">尚未导出</span>',
      phaseTag(a),
      `<div class="ops">
        <button class="btn sm" data-act="openApp" data-v="${a.no}">详情</button>
        ${!sent ? '<button class="btn sm" disabled title="外服尚未导出报送，暂不可标记">标记已读</button>'
                : a.read ? '<button class="btn sm" disabled>已读</button>'
                : `<button class="btn sm primary" data-act="markRead" data-v="${a.no}">标记已读</button>`}
      </div>`
    ]};
  });
  return `<div class="tb-wrap"><table class="tb" id="gvTable">
    <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,i)=>`<tr data-k="${esc(r.k)}" data-i="${i}">${r.c.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>
  <div class="pager" id="gvPager"></div>
  <div class="empty" id="gvEmpty" style="display:none"><div class="em">◍</div>没有匹配的记录，换个关键词或切换筛选试试</div>`;
}

/* ---------- 交互：关键词过滤 × 分页（显隐控制，不重渲染不丢焦点） ---------- */
function applyGovView(){
  const tb = document.getElementById('gvTable'); if(!tb) return;
  const kw = String(state.gk||'').trim().toLowerCase();
  const trs = Array.prototype.slice.call(tb.querySelectorAll('tbody tr'));
  const hits = trs.filter(tr => !kw || (tr.dataset.k||'').indexOf(kw)>=0);
  const pages = Math.max(1, Math.ceil(hits.length / GOV_PAGE_SIZE));
  const cur = Math.min(Math.max(1, state.gpage||1), pages);
  state.gpage = cur;
  const start = (cur-1)*GOV_PAGE_SIZE;
  const inPage = new Set(hits.slice(start, start+GOV_PAGE_SIZE));
  trs.forEach(tr=>{ tr.style.display = inPage.has(tr) ? '' : 'none'; });

  const c = document.getElementById('gvCount'); if(c) c.textContent = hits.length;
  const e = document.getElementById('gvEmpty'); if(e) e.style.display = hits.length ? 'none' : '';
  const w = tb.closest('.tb-wrap'); if(w) w.style.display = trs.length ? '' : 'none';

  const pg = document.getElementById('gvPager');
  if(pg){
    if(hits.length <= GOV_PAGE_SIZE){ pg.style.display = 'none'; pg.innerHTML = ''; }
    else { pg.style.display = ''; pg.innerHTML = gvPagerHTML(cur, pages, hits.length); }
  }
}
function gvPagerHTML(cur, pages, total){
  let nums = '';
  for(let i=1;i<=pages;i++) nums += `<button class="pg ${i===cur?'on':''}" onclick="gvPage(${i})">${i}</button>`;
  return `<span class="pg-info">共 ${total} 条 · 每页 ${GOV_PAGE_SIZE} 条 · 第 ${cur} / ${pages} 页</span>
    <button class="pg" ${cur<=1?'disabled':''} onclick="gvPage(${cur-1})">‹ 上一页</button>${nums}
    <button class="pg" ${cur>=pages?'disabled':''} onclick="gvPage(${cur+1})">下一页 ›</button>`;
}
window.gvPage = (p)=>{ state.gpage = p; applyGovView(); };

window.govFilter = function(inp){
  state.gk = inp.value;
  state.gpage = 1;
  applyGovView();
};

ACT.govClear = ()=>{ state.gk = ''; state.gpage = 1; render(); };

/* 渲染后钩子（按页面注册） */
window.__after = window.__after || {};
window.__after['gov.gPass'] = applyGovView;

/* ---------- 页面 ---------- */
G.gPass = function(){
  const all  = govList();
  const ph   = tabState.gPassTab || 'all';
  const wait = all.filter(a=>phaseOf(a)==='wait').length;
  const sent = all.filter(a=>phaseOf(a)==='sent').length;
  const read = all.filter(a=>phaseOf(a)==='read').length;
  const list = all.filter(inView);
  const kw   = esc(state.gk||'');
  const unread = all.filter(a=>a.batch&&a.batch!=='—'&&!a.read).length;

  return `
  <div class="page-head"><div class="crumb">市人社局 / 认定通过查询</div><h1>外服认定通过记录</h1>
    <p>查询上海外服已完成核验（认定通过）的比照认定记录；本角色为只读，仅可对已报送记录标记已读</p></div>

  <div class="box ${unread?'warn':'ok'}" style="margin-bottom:14px;display:flex;align-items:center;gap:12px">
    <div style="flex:1">
      外服累计核验通过 <b>${all.length}</b> 条 —— 待外服导出 <b>${wait}</b> 条 · 已报送待接收 <b>${sent}</b> 条 · 人社已读 <b>${read}</b> 条
      ${unread?`<br><span class="mini">其中 ${unread} 条已报送但尚未标记已读，标记后即纳入监管台账。</span>`:''}
    </div>
    ${unread?`<button class="btn primary" data-act="markAllRead">全部标记已读（${unread}）</button>`
            :`<button class="btn sm" data-act="toastDemo" data-msg="已导出认定通过台账（Excel）">导出台账</button>`}
  </div>

  <div class="card"><div class="card-h">
      <h3>认定通过记录</h3><span class="sub">外服已作出核验通过结论 · 共 ${all.length} 条</span>
      <div class="right"><button class="btn sm" data-act="toastDemo" data-msg="已导出认定通过台账（xlsx）">导出台账</button></div>
    </div>
    <div class="card-b tight" style="padding:0 16px 4px">
      <div class="qbar" style="flex-wrap:wrap;gap:8px">
        <div class="qin" style="flex:1;min-width:280px">
          <span class="qic">⌕</span>
          <input id="gvSearch" type="text" value="${kw}"
            placeholder="搜索申报编号 / 姓名 / 单位 / 证书名称或编号 / 拟认定职业 / 批次号 / 核验人"
            oninput="govFilter(this)">
          ${kw?'<span class="qx" data-act="govClear" title="清空关键词">✕</span>':''}
        </div>
        <div class="qchips">
          ${Object.keys(PHASE).map(k=>`<span class="qchip ${ph===k?'on':''}" data-act="tab" data-key="gPassTab" data-v="${k}">${PHASE[k]}${k==='all'?'（'+all.length+'）':k==='wait'?'（'+wait+'）':k==='sent'?'（'+sent+'）':'（'+read+'）'}</span>`).join('')}
        </div>
        <span class="qcount">命中 <b id="gvCount">${list.length}</b> 条</span>
        <span class="qhint">支持实时过滤，切换筛选不丢失关键词</span>
      </div>
      ${list.length ? gTable(list) : empty('当前筛选条件下暂无记录')}
    </div>
  </div>

  <div class="box grey" style="margin-top:14px">
    <b>说明：</b>① 本页仅展示外服已作出<b>核验通过</b>结论的记录，审核中、退回补正、不予认定的记录不在此列；
    ② 人社端为<b>只读角色</b>，可查看详情、标记已读、导出台账，不能修改申报内容或审批结论；
    ③ 外服尚未导出报送的记录暂不可标记已读；④ 如需退回或补充材料，通过线下渠道联系上海外服，由其在平台侧变更状态。
  </div>`;
};

/* 删除旧页面入口（同步记录 / 报送批次 / 统计分析 / 政策依据） */
['gInbox','gBatches','gStats','gGuide'].forEach(k=>{ delete G[k]; });

})();

</script>

  const p = location.hash.replace('#/','').split('/');
  if(p[0] && ROLES[p[0]]){ state.role = p[0]; state.page = p[1] || MENU[p[0]].find(m=>m.k).k; }
  render();
})();
</script>
