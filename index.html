<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能申 · 上海市职业技能比照认定平台（Demo）</title>
<style>
/* 技能申（上海市职业技能比照认定平台） - 设计系统 */
:root{
  --brand:#14539A; --brand-600:#0F3F78; --brand-050:#EAF1FA; --brand-100:#D4E4F6;
  --accent:#0E9F6E; --accent-050:#E6F6EF;
  --warn:#D98207; --warn-050:#FDF3E3;
  --danger:#C62A2A; --danger-050:#FBEAEA;
  --info:#0B7EA8; --info-050:#E5F4FA;
  --ink:#15202B; --ink-2:#3F5170; --ink-3:#6B7C93; --ink-4:#97A5B6;
  --line:#DFE6EF; --line-2:#EDF2F8;
  --bg:#F4F7FB; --panel:#FFFFFF;
  --r:10px; --r-s:6px;
  --sh-1:0 1px 2px rgba(16,38,66,.06),0 1px 3px rgba(16,38,66,.04);
  --sh-2:0 4px 14px rgba(16,38,66,.08),0 1px 3px rgba(16,38,66,.05);
  --sh-3:0 18px 48px rgba(13,32,56,.18);
  --sidebar:236px; --topbar:60px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C6D2E0;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#AAB9CC}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶部 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:60;
  background:linear-gradient(90deg,#0F3F78 0%,#14539A 55%,#1A63B8 100%);
  display:flex;align-items:center;padding:0 20px;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12),var(--sh-1);
}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.logo-badge{
  width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
  border:1px solid rgba(255,255,255,.28);
}
.logo small{font-weight:400;font-size:11px;opacity:.75;letter-spacing:0}
.top-sep{width:1px;height:24px;background:rgba(255,255,255,.24);margin:0 16px}
.role-switch{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:9px}
.role-btn{
  border:0;background:transparent;color:rgba(255,255,255,.82);padding:5px 12px;border-radius:6px;
  cursor:pointer;font-size:13px;white-space:nowrap;transition:.15s;
}
.role-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.role-btn.on{background:#fff;color:var(--brand-600);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px}
.top-right .chip{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:20px;font-size:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

/* ---------- 布局 ---------- */
.shell{display:flex;padding-top:var(--topbar);min-height:100vh}
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 10px 40px;z-index:50;
}
.side-title{font-size:11px;color:var(--ink-4);letter-spacing:1.4px;padding:10px 12px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;
  color:var(--ink-2);font-size:13.5px;margin-bottom:2px;transition:.12s;user-select:none;
}
.nav-item:hover{background:var(--brand-050);color:var(--brand)}
.nav-item.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(20,83,154,.28)}
.nav-item .ico{width:18px;text-align:center;font-size:14px;opacity:.9}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;padding:1px 6px;border-radius:10px;font-weight:600}
.nav-item.on .badge{background:rgba(255,255,255,.28)}
.main{flex:1;margin-left:var(--sidebar);padding:22px 26px 60px;min-width:0}
.page-head{margin-bottom:16px}
.page-head h1{font-size:21px;margin:0 0 4px;font-weight:700;letter-spacing:.3px}
.page-head p{margin:0;color:var(--ink-3);font-size:13px}
.crumb{font-size:12px;color:var(--ink-4);margin-bottom:6px}

/* ---------- 卡片 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);margin-bottom:16px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:14.5px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--ink-4);font-weight:400}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px}
.card-b.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1180px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

/* ---------- 统计卡 ---------- */
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.stat .label{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.stat .num{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .trend{font-size:12px;margin-top:3px;color:var(--ink-4)}
.stat .trend.up{color:var(--accent)} .stat .trend.down{color:var(--danger)}
.stat .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.stat .ico{
  position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--brand-050)
}

/* ---------- 表格 ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{
  background:#F7FAFD;color:var(--ink-2);font-weight:600;text-align:left;padding:10px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;
}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tb tbody tr:hover{background:#FAFCFF}
table.tb tbody tr:last-child td{border-bottom:0}
.tb-wrap{overflow-x:auto}
.link{cursor:pointer;color:var(--brand);font-weight:500}
.link:hover{text-decoration:underline}

/* ---------- 标签 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.7}
.tag.blue{background:var(--brand-050);color:var(--brand)}
.tag.green{background:var(--accent-050);color:#0B7A55}
.tag.red{background:var(--danger-050);color:var(--danger)}
.tag.orange{background:var(--warn-050);color:#A96405}
.tag.cyan{background:var(--info-050);color:var(--info)}
.tag.grey{background:#F1F4F8;color:var(--ink-3)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}

/* ---------- 按钮 ---------- */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:6px 13px;border-radius:7px;
  cursor:pointer;font-size:13px;transition:.14s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:#B9C9DC;background:#FAFCFF;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.btn.success{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.success:hover{filter:brightness(.94);color:#fff}
.btn.danger{background:#fff;border-color:#EBB9B9;color:var(--danger)}
.btn.danger:hover{background:var(--danger-050)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.lg{padding:9px 20px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px}
.field label .req{color:var(--danger);margin-left:2px}
.field .hint{font-size:11.5px;color:var(--ink-4);margin-top:4px}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;transition:.14s;
}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(20,83,154,.1)}
textarea{min-height:80px;resize:vertical}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:820px){.f-row,.f-row-3{grid-template-columns:1fr}}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:8px;line-height:1.5}
.check input{margin-top:3px;accent-color:var(--brand)}
.upload{
  border:1.5px dashed #C4D2E2;border-radius:9px;padding:18px;text-align:center;background:#FBFDFF;
  cursor:pointer;transition:.14s;color:var(--ink-3);font-size:13px;
}
.upload:hover{border-color:var(--brand);background:var(--brand-050);color:var(--brand)}
.file-item{
  display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;
  margin-top:8px;background:#fff;font-size:13px;
}
.file-item .fs{margin-left:auto;font-size:11.5px;color:var(--ink-4)}

/* ---------- 时间轴 ---------- */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;
  border:2px solid var(--line);
}
.tl-item.done .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl-item.cur .tl-dot{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px rgba(20,83,154,.16)}
.tl-item.fail .tl-dot{background:var(--danger);border-color:var(--danger)}
.tl-title{font-weight:600;font-size:13.5px}
.tl-meta{font-size:12px;color:var(--ink-4);margin-top:1px}
.tl-body{font-size:12.5px;color:var(--ink-2);margin-top:5px;background:#F7FAFD;border-radius:6px;padding:7px 10px}

/* ---------- 步骤条 ---------- */
.steps{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:6px}
.step{display:flex;align-items:center;gap:8px}
.step .n{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;background:#EDF2F8;color:var(--ink-4);flex:none;
}
.step .t{font-size:13px;color:var(--ink-4)}
.step.done .n{background:var(--accent);color:#fff}
.step.done .t{color:var(--ink-2)}
.step.cur .n{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(20,83,154,.14)}
.step.cur .t{color:var(--brand);font-weight:600}
.step-line{width:36px;height:2px;background:var(--line);margin:0 8px}
.step-line.done{background:var(--accent)}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(13,32,56,.42);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:#fff;z-index:100;
  box-shadow:var(--sh-3);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,.61,.36,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-h h3{margin:0;font-size:16px}
.drawer-h .x{margin-left:auto;cursor:pointer;font-size:20px;color:var(--ink-4);line-height:1}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px}
.drawer-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#FCFDFE}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#15202B;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;box-shadow:var(--sh-2);
  animation:tin .25s ease;display:flex;align-items:center;gap:8px;
}
.toast.ok{background:#0B7A55}.toast.err{background:#B32626}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ---------- 其它 ---------- */
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13px}
.kv .k{color:var(--ink-4)}
.kv .v{color:var(--ink)}
.box{padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.65}
.box.info{background:var(--info-050);border:1px solid #C6E3F0;color:#0A5F7F}
.box.warn{background:var(--warn-050);border:1px solid #F3DCAE;color:#8A5A05}
.box.ok{background:var(--accent-050);border:1px solid #B9E4D1;color:#0B6B4C}
.box.err{background:var(--danger-050);border:1px solid #EEC4C4;color:#A32323}
.box.grey{background:#F6F8FB;border:1px solid var(--line);color:var(--ink-2)}
.divider{height:1px;background:var(--line-2);margin:14px 0}
.pill-tabs{display:inline-flex;background:#EEF3F9;padding:3px;border-radius:8px;gap:2px;margin-bottom:14px}
.pill-tabs .pt{padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.pill-tabs .pt.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:var(--sh-1)}
.empty{text-align:center;padding:44px 20px;color:var(--ink-4);font-size:13px}
.empty .em{font-size:32px;margin-bottom:8px;opacity:.5}
.searchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.searchbar input,.searchbar select{width:auto;min-width:130px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar-wrap{height:7px;background:#EDF2F8;border-radius:4px;overflow:hidden;min-width:80px}
.bar{height:100%;border-radius:4px;background:var(--brand)}
.bar.g{background:var(--accent)}.bar.o{background:var(--warn)}.bar.r{background:var(--danger)}
.mini{font-size:12px;color:var(--ink-4)}
.badge-num{display:inline-block;min-width:18px;padding:0 5px;background:var(--danger);color:#fff;border-radius:9px;font-size:11px;text-align:center;font-weight:600}

/* 进度环 */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{flex:none}

/* 打印 */
@media print{
  .topbar,.sidebar,.no-print{display:none!important}
  .main{margin:0;padding:0}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}
@media(max-width:760px){
  .sidebar{display:none}.main{margin-left:0;padding:14px}
  .topbar{padding:0 12px}.logo small{display:none}.top-sep{display:none}
}

</style>
<style>
/* ============ 技能申 · 增量样式 ============ */

/* 未读红点 / 已读态 */
.unread-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C62A2A;margin-right:6px;vertical-align:middle}
.row-unread{background:#FBFDFF}
.row-unread td:first-child{box-shadow:inset 3px 0 0 #C62A2A}
.row-read td{color:var(--ink-3)}
.read-tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px}
.read-tag.no{background:#FBEAEA;color:#C62A2A}
.read-tag.yes{background:#F1F4F8;color:var(--ink-3)}

/* 免试条件核对行 */
.cond{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.cond:last-child{margin-bottom:0}
.cond-row{display:grid;grid-template-columns:150px 1fr 130px 84px;align-items:center;gap:0;font-size:13px}
.cond-row>div{padding:9px 12px;border-right:1px solid var(--line-2)}
.cond-row>div:last-child{border-right:0;text-align:center}
.cond-k{color:var(--ink-3);background:#FAFCFF;font-size:12.5px}
.cond-v{color:var(--ink);font-weight:500}
.cond-req{color:var(--ink-2);font-size:12.5px}
.cond-ok{color:#0B7A55;font-weight:600}
.cond-no{color:#C62A2A;font-weight:600}
.cond-warn{color:#A96405;font-weight:600}

/* 对应关系卡片（查询结果） */
.pair{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:16px 18px;box-shadow:var(--sh-1);margin-bottom:12px}
.pair-hit{border-left-color:var(--accent);background:linear-gradient(180deg,#F7FDFA,#fff 42%)}
.pair-miss{border-left-color:var(--warn)}
.pair-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.pair-h h4{margin:0;font-size:15.5px;font-weight:700;letter-spacing:.2px}
.pair-h .lv{font-size:12px;color:var(--ink-3);margin-top:3px}
.pair-h .right{margin-left:auto;text-align:right;flex-shrink:0}
.pair-arrow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);margin:10px 0 12px;flex-wrap:wrap}
.pair-arrow .src,.pair-arrow .tgt{background:#F6F8FB;border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--ink);font-weight:500}
.pair-arrow .tgt{background:var(--brand-050);border-color:var(--brand-100);color:var(--brand-600)}
.pair-arrow .ar{color:var(--brand);font-weight:700;font-size:14px}

/* 流程条 */
.strip{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:2px 0 4px}
.strip .s{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);background:#F6F8FB;border:1px solid var(--line);border-radius:20px;padding:5px 12px}
.strip .s b{color:var(--brand)}
.strip .s.done{background:var(--accent-050);border-color:#BFE7D4;color:#0B7A55}
.strip .s.cur{background:var(--brand);border-color:var(--brand);color:#fff}
.strip .s.cur b{color:#fff}
.strip .ar{color:var(--ink-4);margin:0 6px;font-size:12px}

/* 表格内联操作组 */
.ops{display:flex;gap:6px;flex-wrap:nowrap}
.nw{white-space:nowrap}

/* 查询输入区 */
.query-box{background:linear-gradient(135deg,#0F3F78,#14539A 55%,#1B62B0);border-radius:12px;padding:22px 24px;color:#fff;box-shadow:0 8px 26px rgba(20,83,154,.24)}
.query-box h3{margin:0 0 4px;font-size:17px}
.query-box p{margin:0 0 16px;font-size:12.5px;opacity:.82}
.query-box .f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.query-box label{display:block;font-size:11.5px;opacity:.85;margin-bottom:5px;letter-spacing:.3px}
.query-box select,.query-box input{width:100%;padding:9px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.96);font-size:13px;color:var(--ink);outline:none}
.query-box .btn{background:#fff;color:var(--brand-600);border-color:#fff;font-weight:600}
.query-box .btn:hover{background:#EAF1FA;color:var(--brand-600)}

/* 结果摘要 */
.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;margin-bottom:14px}
.verdict.ok{background:var(--accent-050);border:1px solid #BFE7D4}

/* ================= 再发起口径（全局唯一判定） =================

const FIX_LIMIT = 2;
const TODAY = '2026-10-29';
function fixTimes(a){ return (a.tl||[]).filter(x=>String(x.t).indexOf('退回补正')>=0).length; }         /* 外服退回次数 */
function fixSubmitTimes(a){ return (a.tl||[]).filter(x=>String(x.t).indexOf('补正提交')>=0).length; }  /* 个人已补正提交次数 */
function fixDeadlineOf(a){
  const m = String(a.memo||'') + ' ' + (a.tl||[]).map(x=>String(x.b||'')).join(' ');
  const r = /(\d{4})-(\d{2})-(\d{2})/.exec(m);
  return r ? r[0] : '';
}
function fixOverdue(a){ const d = fixDeadlineOf(a); return !!d && d < TODAY; }
function canFixResubmit(a){

function fixBlockReason(a){
  if(fixOverdue(a)) return `补正期限（${fixDeadlineOf(a)}）已过，需上海外服破例开通后再提交`;
  if(fixSubmitTimes(a) >= FIX_LIMIT) return `补正次数已用尽（${FIX_LIMIT}/${FIX_LIMIT}），需上海外服破例开通后再提交`;
  return '该记录当前不可补正提交';
}

/* ---------- 图表 ---------- */
function barChart(data, w, h, color){
  w=w||420; h=h||200; const pad={l:150,r:44,t:6,b:6};
  const max=Math.max.apply(null,data.map(d=>d.v))*1.1;
  const ih=h-pad.t-pad.b, iw=w-pad.l-pad.r, bh=ih/data.length*0.6;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${data.map((d,i)=>{
    const y=pad.t+ih/data.length*i+(ih/data.length-bh)/2;
    const bw=Math.max(2,iw*(d.v/max));
    return `<text x="${pad.l-8}" y="${y+bh/2+4}" font-size="11" fill="#3F5170" text-anchor="end">${esc(d.k)}</text>
      <rect x="${pad.l}" y="${y}" width="${iw}" height="${bh}" rx="4" fill="#F1F4F8"/>
      <rect x="${pad.l}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${color||'#14539A'}"/>
      <text x="${pad.l+bw+7}" y="${y+bh/2+4}" font-size="11" fill="#6B7C93">${d.v}</text>`;
  }).join('')}</svg>`;
}
function lineChart(data, w, h, colorA, colorB){
  w=w||560; h=h||180;
  const pad={l:36,r:12,t:16,b:24};
  const max = Math.max.apply(null, data.map(d=>Math.max(d.a,d.b)))*1.15;
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const X = i => pad.l + iw*(i/(data.length-1));
  const Y = v => pad.t + ih - ih*(v/max);
  const path = k => data.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(d[k]).toFixed(1)}`).join(' ');
  const area = k => `${path(k)} L${X(data.length-1)},${pad.t+ih} L${pad.l},${pad.t+ih} Z`;
  let g='';
  for(let i=0;i<=4;i++){ const y=pad.t+ih*(i/4); const v=Math.round(max*(1-i/4));
    g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#EDF2F8"/><text x="${pad.l-6}" y="${y+4}" font-size="10" fill="#97A5B6" text-anchor="end">${v}</text>`; }
  const dots = data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.a)}" r="3" fill="#fff" stroke="${colorA}" stroke-width="2"/>`).join('');
  const lbl = data.map((d,i)=>`<text x="${X(i)}" y="${h-6}" font-size="10" fill="#97A5B6" text-anchor="middle">${d.m.slice(5)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    ${g}<path d="${area('a')}" fill="${colorA}" opacity=".07"/>
    <path d="${path('a')}" fill="none" stroke="${colorA}" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="${path('b')}" fill="none" stroke="${colorB}" stroke-width="2.2" stroke-dasharray="4 3" stroke-linejoin="round"/>
    ${dots}${lbl}
    <g font-size="11"><rect x="${w-146}" y="5" width="10" height="3" fill="${colorA}"/><text x="${w-131}" y="11" fill="#6B7C93">申请量</text>
    <rect x="${w-76}" y="5" width="10" height="3" fill="${colorB}"/><text x="${w-61}" y="11" fill="#6B7C93">通过量</text></g></svg>`;
}

function renderShell(){
  const r = ROLES[state.role];
  $('#roleBtns').innerHTML = Object.keys(ROLES).map(k=>
    `<button class="role-btn ${k===state.role?'on':''}" data-act="role" data-v="${k}">${ROLES[k].name}</button>`).join('');
  $('#userBox').innerHTML = `<div style="text-align:right;line-height:1.3"><div style="font-weight:600">${esc(r.user)}</div><div style="font-size:11px;opacity:.8">${esc(r.tagline)}</div></div><div class="avatar" style="color:${r.color}">${esc(r.avatar)}</div>`;
  $('#nav').innerHTML = MENU[state.role].map(m=>{
    if(m.g) return `<div class="side-title">${esc(m.g)}</div>`;
    const b = m.badgeFn ? m.badgeFn() : m.badge;
    return `<div class="nav-item ${m.k===state.page?'on':''}" data-act="nav" data-v="${m.k}"><span class="ico">${m.i}</span>${esc(m.t)}${b?`<span class="badge">${b}</span>`:''}</div>`;
  }).join('');
}
function render(){
  renderShell();
  const fn = PAGES[state.role][state.page];
  const host = $('#view');
  host.innerHTML = fn ? fn() : empty('页面建设中');
  /* 渲染后钩子：按「角色.页面」注册，便于各页自定义分页 / 过滤 */
  const af = (window.__after && window.__after[state.role+'.'+state.page]) || window.afterRender;
  if(typeof af === 'function'){ try{ af(); }catch(e){} }
  window.scrollTo(0,0);
}
function go(role, page){
  if(role) state.role = role;
  if(page) state.page = page;
  state.q = null;
  location.hash = `#/${state.role}/${state.page}`;
  render();
}

};

/* ---------------- Excel 预览 ---------------- */
ACT.openExcel = (batchNo)=>{
  const list = batchNo
    ? DB.apps.filter(a=>a.batch===batchNo)
    : DB.apps.filter(a=>a.status==='核验通过');
  const head = `<tr><td class="xl-idx"></td>${DB.exportCols.map((c,i)=>`<th>${String.fromCharCode(65+Math.floor(i/1)>90?65:i%26)}</th>`).slice(0,0)}${DB.exportCols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
  const rows = list.map((a,i)=>{
    const cells = [i+1, a.no, a.name, a.idNo, a.phone, a.srcCert, a.srcNo, a.org||a.srcOrg, a.srcDate,
      a.tgtJob, DB.pairs.find(p=>p.id===a.pairId)?.tgtCode||'', a.tgtLevel, a.socMonths, a.workYears, a.edu, a.company,
      '核验通过', a.verifier, a.verifyAt];
    return `<tr><td class="xl-idx">${i+2}</td>${cells.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`;

  drawer(`Excel 预览 · 技能申同步${batchNo?'（'+batchNo+'）':''}`,

    </div>
    <div class="xl"><table>${head}${rows||'<tr><td colspan="19" style="padding:16px;text-align:center;color:#8A9AAC">无数据</td></tr>'}</table></div>
    <div class="box grey" style="margin-top:12px;font-size:12.5px">
      文件名规则：<b>技能申同步_YYYYMMDD.xlsx</b>　|　编码：UTF-8　|　表头行：1 行　|　不得增删列
    </div>`,
    batchNo
      ? `<button class="btn" data-act="closeDrawer">关闭</button>
         <button class="btn primary" data-act="toastDemo" data-msg="文件已重新下载">下载 Excel</button>`

         <button class="btn primary" data-act="exportBatch">确认导出并生成批次</button>`);
};

</script>
<script>
/* ==================================================================
   免试对应目录（覆盖 pages-org.js 的 O.pairs）
   能力：关键词搜索 + 多维筛选 + 排序 + 新增 / 编辑 / 停用（维护）
   ================================================================== */
(function(){

const O = PAGES.org;
const DEF = {job:'all', level:'all', type:'all', org:'all', batch:'all', quick:'', sort:'id'};
if(!state.pf) state.pf = Object.assign({}, DEF);

const LEVELS = ['五级/初级','四级/中级','三级/高级','二级/技师','一级/高级技师'];
const TYPES  = ['企业认证','国（境）外认证','国家职业资格','行业认证'];
const EDUS   = ['不限','高中及以上','大专及以上','本科及以上','硕士及以上'];
const REGIONS = ['中国','英国','德国','比利时','美国','日本','新加坡','中国香港','其他'];
const BATCH_NAMES = DB.docs.map(d=>d.batch).concat(['待归入目录']);

/* 目录批次 = 已发布政策文件；统一申报口径为「在本市就业满 6 个月」，故不再按社保门槛分档 */
const BATCHES = [{k:'all', t:'目录批次：全部', f:()=>true}].concat(
  DB.docs.map(d=>({k:d.batch, t:`${d.batch}（${d.doc}）`, f:p=>p.batch===d.batch}))
);

const QUICKS = [
  {k:'ysz',     t:'一试双证（企业认证）',   f:p=>p.srcType==='企业认证'},
  {k:'gw',      t:'国（境）外证书',         f:p=>p.srcType==='国（境）外认证'},
  {k:'used100', t:'高频使用（≥100 人次）',  f:p=>p.used>=100},
  {k:'recent',  t:'最近发布（近 180 天）',  f:p=>daysSince(p.docDate)<=180},
  {k:'mine',    t:'我维护的（王建国）',     f:p=>p.owner==='王建国'},
];
const SORTS = [
  {k:'id',   t:'排序：按编号'},
  {k:'used', t:'排序：使用量 高 → 低'},
  {k:'doc',  t:'排序：按目录批次'},
  {k:'upd',  t:'排序：最近发布'},
];

/* ---------- 小工具 ---------- */
function daysSince(d){
  const t = new Date(String(d).replace(/-/g,'/').slice(0,10));
  if(isNaN(t)) return 9999;
  return Math.max(0, Math.round((new Date('2026/10/29') - t)/86400000));
}
function hayOf(p){
  return [p.id, p.src, p.srcKey, p.srcEn, p.srcOrg, p.srcOrgEn, p.srcType, p.region,
          p.doc, p.batch, p.tgt, p.tgtCode, p.tgtLevel,
          p.edu, p.extra, p.note, p.owner, p.basis, p.status].join(' ').toLowerCase();
}
/* 关键词高亮（先转义再匹配，避免破坏 HTML） */
function hl(s, kw){
  const t = esc(s);
  if(!kw) return t;
  const k = esc(kw).toLowerCase();
  const i = t.toLowerCase().indexOf(k);
  if(i < 0) return t;
  return t.slice(0,i) + '<span class="hl">' + t.slice(i, i+k.length) + '</span>' + t.slice(i+k.length);
}
function uniq(arr){ return [...new Set(arr.filter(Boolean))]; }

function bucketOf(k){ return BATCHES.find(b=>b.k===k) || BATCHES[0]; }
function quickOf(k){ return QUICKS.find(q=>q.k===k); }

/* 数据级筛选（关键词走即时行过滤，这里只处理下拉 / 快捷 / 状态 / 排序） */
function filtered(){
  const st = tabState.certTab || 'all';
  const pf = state.pf;
  let list = DB.pairs.filter(p=>{
    if(st!=='all' && p.status!==st) return false;
    if(pf.job  !=='all' && p.tgt     !== pf.job)   return false;
    if(pf.level!=='all' && p.tgtLevel!== pf.level) return false;
    if(pf.type !=='all' && p.srcType !== pf.type)  return false;
    if(pf.org  !=='all' && p.srcOrg  !== pf.org)   return false;
    if(!bucketOf(pf.batch).f(p)) return false;
    const q = quickOf(pf.quick);
    if(q && !q.f(p)) return false;
    return true;
  });
  const s = pf.sort || 'id';
  list = list.slice().sort((a,b)=>{
    if(s==='used') return b.used - a.used;
    if(s==='doc')  return String(b.docDate).localeCompare(String(a.docDate)) || a.seq - b.seq;
    if(s==='upd')  return String(b.upd).localeCompare(String(a.upd));
    return String(a.id).localeCompare(String(b.id));
  });
  return list;
}

function sel(id, label, opts, cur){
  return `<select onchange="pairSet(this)" data-key="${id}" style="width:158px;flex:none">
    ${opts.map(o=>`<option value="${esc(o.v)}" ${cur===o.v?'selected':''}>${esc(label?label+'：'+o.t:o.t)}</option>`).join('')}
  </select>`;
}

/* ---------- 页面 ---------- */
O.pairs = ()=>{
  const st = tabState.certTab || 'all';
  const pf = state.pf;
  const kw = String(state.pk||'');
  const list = filtered();
  const total = DB.pairs.length;

  const jobs  = uniq(DB.pairs.map(p=>p.tgt));
  const orgs  = uniq(DB.pairs.map(p=>p.srcOrg));
  const types = uniq(DB.pairs.map(p=>p.srcType));

  return `
  <div class="page-head"><div class="crumb">上海外服 / 免试对应目录</div><h1>免试对应目录</h1>
    <p>基础数据取自市人社局已发布的三批官方目录；维护「已持有证书 → 可免试比照认定的职业（工种）+ 等级 + 条件」，支持新增、编辑、停用与多维检索；是个人端查询页的唯一数据源</p></div>

  <div class="card" style="margin-bottom:16px"><div class="card-h">
      <h3>目录数据来源（已发布政策文件）</h3><span class="sub">共 ${DB.docs.length} 个文号 · ${total} 条对应关系</span>
    </div>
    <div class="card-b tight">
      <div class="tb-wrap"><table class="tb">
        <thead><tr>${['文号','目录名称','发布日期','条数','申报门槛','备注'].map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${DB.docs.map(d=>{
          const n = DB.pairs.filter(p=>p.batch===d.batch).length;
          return `<tr>
            <td>${mono(d.doc)}</td>
            <td><b>${esc(d.title)}</b></td>
            <td>${esc(d.date)}</td>
            <td><b>${n}</b> 条</td>
            <td><span class="mini">${esc(d.gate)}</span></td>
            <td><span class="mini">${esc(d.note)}</span></td>
          </tr>`;}).join('')}
        </tbody>
      </table></div>
      <div class="box info" style="margin:12px 0 0">
        <b>统一口径：</b>经比照认定颁发的职业技能等级证书，效力等同于通过职业技能等级认定所发的证书，纳入本市技能人才统计范畴，
        可作为晋升高一等级的申报依据并享受相应技能人才政策待遇；<b>目录实行动态调整</b>，未列入目录的项目不得开展比照认定。
      </div>
    </div>
  </div>

  <div class="grid g4" style="margin-bottom:16px">
    ${stat('对应关系', total, '条', '▦', '#14539A')}
    ${stat('生效中', DB.pairs.filter(p=>p.status==='生效').length, '条', '✓', '#0E9F6E')}
    ${stat('累计使用', num(DB.pairs.reduce((s,p)=>s+p.used,0)), '人次', '↑', '#0B7EA8')}
    ${stat('覆盖职业', new Set(DB.pairs.map(p=>p.tgt)).size, '个职业（工种）', '◧', '#D98207')}
  </div>

  <div class="card"><div class="card-h">
      <h3>目录检索</h3><span class="sub">共 ${total} 条对应关系</span>
      <div class="right">
        <button class="btn sm" data-act="toastDemo" data-msg="已下载导入模板（xlsx）">导入目录</button>
        <button class="btn sm" data-act="toastDemo" data-msg="当前检索结果已导出为 Excel">导出结果</button>
        <button class="btn sm primary" data-act="pairNew">+ 新增对应关系</button>
      </div>
    </div>
    <div class="card-b tight" style="padding:0 16px 4px">

      <div class="qbar" style="border-bottom:none;margin-bottom:6px">
        <div class="qin" style="flex:2;min-width:300px">
          <span class="qic">⌕</span>
          <input id="pkSearch" type="text" value="${esc(kw)}"
            placeholder="搜索证书名称（中/英文）/ 目标职业 / 编号（MP-001）/ 文号 / 国家地区 / 发证机构"
            oninput="pairFilter(this)">
          <span class="qx" data-act="pairClear" title="清空全部筛选">✕</span>
        </div>
        ${sel('batch','', BATCHES.map(b=>({v:b.k,t:b.t})), pf.batch)}
        ${sel('job','目标职业', [{v:'all',t:'全部'}].concat(jobs.map(v=>({v,t:v}))), pf.job)}
        ${sel('level','等级', [{v:'all',t:'全部'}].concat(LEVELS.map(v=>({v,t:v}))), pf.level)}
        ${sel('type','证书类型', [{v:'all',t:'全部'}].concat(types.map(v=>({v,t:v}))), pf.type)}
        ${sel('sort','', SORTS.map(s=>({v:s.k,t:s.t})), pf.sort)}
        <span class="qcount" style="flex:none">命中 <b id="pkCount">${list.length}</b> / 共 ${total} 条</span>
      </div>

      <div class="qchips">
        <span class="qc-lab">快捷查询</span>
        ${QUICKS.map(q=>`<span class="qchip ${pf.quick===q.k?'on':''}" data-act="pairQuick" data-v="${q.k}">${esc(q.t)}</span>`).join('')}
        ${pf.quick||pf.job!=='all'||pf.level!=='all'||pf.type!=='all'||pf.batch!=='all'||st!=='all'||kw
          ? `<span class="qchip clr" data-act="pairClear">清空筛选 ✕</span>` : ''}
        <span class="qhint" style="margin-left:auto">关键词实时过滤，切换条件不丢失</span>
      </div>

      <div class="pill-tabs">
        ${[{k:'all',t:'全部',n:total},
           {k:'生效',t:'生效中',n:DB.pairs.filter(p=>p.status==='生效').length},
           {k:'停用',t:'已停用',n:DB.pairs.filter(p=>p.status==='停用').length}]
          .map(it=>`<div class="pt ${st===it.k?'on':''}" data-act="pairStatus" data-v="${it.k}">${esc(it.t)} <b style="opacity:.7">${it.n}</b></div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px"><div class="card-h">
      <h3>对应关系清单</h3><span class="sub">命中 <b id="pkCount2">${list.length}</b> 条</span>
      <div class="right"><span class="mini">点击「查看」看完整条件与政策依据，「编辑」可改条件（版本化留痕）</span></div>
    </div>
    <div class="card-b tight" style="padding:0 16px 12px">
      ${list.length ? pkTable(list, kw) : `<div class="empty"><div class="em">◍</div>没有匹配的对应关系，试试放宽条件或
        <span class="link" data-act="pairClear">清空筛选</span></div>`}
    </div>
  </div>

  <div class="box info" style="margin-top:14px">
    <b>维护规则：</b>对应关系依据市人社局已发布的目录（沪人社职〔2026〕5号 /〔2025〕338号 /〔2026〕217号）与《国家职业技能标准》制定，
    一条关系对应一个「原证书型号 + 目标职业（工种）+ 认定等级」；统一申报门槛为<b>在本市就业满 6 个月</b>，不受国籍、户籍限制。
    个别证书另有附加要求（如华为、立邦证书须在有效期内；KNX 证书以 2025-11-30 为界需补充考核）。<br>
    <span class="mini">检索维度：证书名称（中/英文）、目录批次与文号、国别（地区）、目标职业（工种）、职业编码、认定等级、证书类型、状态、维护人与政策依据；
    停用关系仍可检索，仅不再受理新申请。职业编码依据《国家职业分类大典》维护，部分新工种标注「待补录」。</span>
  </div>

  <div class="box grey" style="margin-top:10px">
    演示说明：新增 / 编辑 / 停用在当前会话内真实生效（会立即影响个人端「免试资格查询」的结果），刷新页面后恢复预置目录数据。
  </div>`;
};

function pkTable(list, kw){
  return `<div class="tb-wrap"><table class="tb" id="pkTable">
    <thead><tr>${['编号','目录批次 / 文号','已持有证书（型号）','国别（地区）','可免试比照认定','认定等级','申报条件','使用量','状态','操作']
      .map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${list.map(p=>`<tr data-k="${esc(hayOf(p))}">
      <td>${mono(p.id)}</td>
      <td><span class="mini">${hl(p.batch, kw)}<br>${hl(p.doc, kw)}</span></td>
      <td><b>${hl(p.src, kw)}</b><br><span class="mini">${hl(p.srcOrg, kw)}　·　${esc(p.srcEn||'')}</span></td>
      <td>${esc(p.region||'—')}<br><span class="mini">${esc(p.srcType)}</span></td>
      <td><b style="color:var(--brand-600)">${hl(p.tgt, kw)}</b><br><span class="mini">${hl(p.tgtCode, kw)}</span></td>
      <td>${tag(p.tgtLevel,'blue')}</td>
      <td><span class="mini">在本市就业满 <b>${p.socMonths}</b> 个月<br>${esc(p.extra||'')}</span></td>
      <td>${p.used} 人次</td>
      <td>${statusTag(p.status)}</td>
      <td><div class="ops">
        <button class="btn sm" data-act="openPair" data-v="${p.id}">查看</button>
        <button class="btn sm" data-act="pairEdit" data-v="${p.id}">编辑</button>
        <button class="btn sm ${p.status==='生效'?'danger':''}" data-act="pairToggle" data-v="${p.id}">${p.status==='生效'?'停用':'启用'}</button>
      </div></td>
    </tr>`).join('')}</tbody>
  </table></div>
  <div class="empty" id="pkEmpty" style="display:none"><div class="em">◍</div>没有匹配的对应关系，换个关键词或放宽筛选条件</div>`;
}

/* ---------- 即时行过滤（关键词，不重渲染、不丢焦点） ---------- */
window.pairFilter = function(inp){
  state.pk = inp.value;
  applyPairFilter();
};
function applyPairFilter(){
  const tb = document.getElementById('pkTable'); if(!tb) return;
  const kw = String(state.pk||'').trim().toLowerCase();
  let shown = 0;
  tb.querySelectorAll('tbody tr').forEach(tr=>{
    const ok = !kw || (tr.dataset.k||'').indexOf(kw)>=0;
    tr.style.display = ok ? '' : 'none';
    if(ok) shown++;
  });
  ['pkCount','pkCount2'].forEach(id=>{ const c = document.getElementById(id); if(c) c.textContent = shown; });
  const e = document.getElementById('pkEmpty'); if(e) e.style.display = shown ? 'none' : '';
  const w = tb.closest('.tb-wrap'); if(w) w.style.display = shown ? '' : 'none';
}
window.applyPairFilter = applyPairFilter;

ACT.pairSet = (v, el)=>{
  if(!el || !el.dataset) return;
  state.pf[el.dataset.key] = v;
  render(); applyPairFilter();
};
ACT.pairQuick = (v)=>{
  state.pf.quick = state.pf.quick===v ? '' : v;
  render(); applyPairFilter();
};
ACT.pairClear = ()=>{
  state.pk = '';
  state.pf = Object.assign({}, DEF);
  tabState.certTab = 'all';
  render();
};
ACT.pairStatus = (v)=>{
  tabState.certTab = v;
  render(); applyPairFilter();
};

/* ---------- 新增 / 编辑 ---------- */
function nextId(){
  const nums = DB.pairs.map(p=>parseInt(String(p.id).replace(/\D/g,''),10) || 0);
  return 'MP-' + String(Math.max.apply(null, nums.concat([0])) + 1).padStart(3,'0');
}
function formRow(label, inner){
  return `<div class="field"><label>${label}</label>${inner}</div>`;
}
function opts(list, cur){
  return list.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('');
}

ACT.pairNew = ()=>pairForm(null);
ACT.pairEdit = (id)=>pairForm(id);

function pairForm(id){
  const p = id ? DB.pairs.find(x=>x.id===id) : null;
  const v = p || {src:'', srcOrg:'', srcEn:'', srcType:'企业认证', region:'中国',
                  batch:'待归入目录', doc:'—', docDate:'2026-10-29',
                  tgt:'', tgtCode:'', tgtLevel:'三级/高级',
                  socMonths:6, years:0, edu:'不限', extra:'证书须在有效期内申请换证', basis:'', owner:'王建国'};
  drawer(p ? `编辑对应关系 · ${p.id}` : '新增免试对应关系',
    `<div class="box info" style="margin:0 0 14px;font-size:12.5px">
      一条对应关系 = 一个「原证书型号 + 目标职业（工种）+ 认定等级」。提交后个人端「免试资格查询」立即可检索到。
      新增的对应关系默认标记为<b>待归入目录</b>，待市人社局发布新版目录文号后再归入对应批次。
    </div>

    <div style="font-weight:700;font-size:13px;margin-bottom:8px">原证书（入口侧）</div>
    <div class="f-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${formRow('证书名称 / 型号 <span style="color:#C62A2A">*</span>', `<input id="pf_src" type="text" value="${esc(v.src)}" placeholder="如 HCIA-Datacom 华为认证数通工程师">`)}
      ${formRow('证书英文原名', `<input id="pf_srcEn" type="text" value="${esc(v.srcEn||'')}" placeholder="如 HCIA-Datacom">`)}
    </div>
    <div class="f-row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      ${formRow('发证机构', `<input id="pf_org" type="text" value="${esc(v.srcOrg)}" placeholder="如 华为技术有限公司">`)}
      ${formRow('证书类型', `<select id="pf_type">${opts(TYPES, v.srcType)}</select>`)}
      ${formRow('国别（地区）', `<select id="pf_region">${opts(REGIONS, v.region)}</select>`)}
    </div>

    <div class="divider"></div>
    <div style="font-weight:700;font-size:13px;margin-bottom:8px">可免试比照认定（出口侧）</div>
    <div class="f-row" style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px">
      ${formRow('目标职业（工种） <span style="color:#C62A2A">*</span>', `<input id="pf_tgt" type="text" value="${esc(v.tgt)}" placeholder="如 信息通信网络运行管理员">`)}
      ${formRow('职业编码', `<input id="pf_code" type="text" value="${esc(v.tgtCode)}" placeholder="如 4-04-02-01，未定填 待补录">`)}
      ${formRow('认定等级', `<select id="pf_level">${opts(LEVELS, v.tgtLevel)}</select>`)}
    </div>

    <div class="divider"></div>
    <div style="font-weight:700;font-size:13px;margin-bottom:8px">申报条件</div>
    <div class="f-row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      ${formRow('在本市就业门槛（月）', `<input id="pf_soc" type="number" min="0" max="120" value="${v.socMonths}">`)}
      ${formRow('学历要求', `<select id="pf_edu">${opts(EDUS, v.edu)}</select>`)}
      ${formRow('目录归属', `<select id="pf_batch">${opts(BATCH_NAMES, v.batch)}</select>`)}
    </div>
    ${formRow('附加条件', `<textarea id="pf_extra" rows="2" placeholder="如：证书须在有效期内申请换证；发证单位须为上海立邦立才职业技能培训有限公司">${esc(v.extra||'')}</textarea>`)}
    ${formRow('政策依据（文号）', `<input id="pf_basis" type="text" value="${esc(v.basis)}" placeholder="如 沪人社职〔2026〕5号">`)}

    ${p&&p.status==='停用'?`<div class="box warn" style="margin-top:10px"><b>停用说明：</b>${esc(p.memo||'—')}</div>`:''}`,
    `<button class="btn" data-act="closeDrawer">取消</button>
     <button class="btn primary" data-act="pairSave" data-v="${p?p.id:''}">${p?'保存修改':'提交新增'}</button>`);
}

ACT.pairSave = (id)=>{
  const g = k => { const el = document.getElementById(k); return el ? String(el.value||'').trim() : ''; };
  const src = g('pf_src'), tgt = g('pf_tgt'), code = g('pf_code');
  if(!src)  return toast('请填写证书名称 / 型号', 'err');
  if(!tgt)  return toast('请填写目标职业（工种）', 'err');
  const soc = parseInt(g('pf_soc'), 10);
  if(isNaN(soc) || soc < 0) return toast('在本市就业门槛需为不小于 0 的整数（月）', 'err');
  const level = g('pf_level');
  const batch = g('pf_batch') || '待归入目录';
  const bd = DB.docs.find(d=>d.batch===batch);

  const dup = DB.pairs.find(x=>x.id!==id && x.src===src && x.tgt===tgt && x.tgtLevel===level && x.status==='生效');
  if(dup) return toast(`已存在生效的相同对应关系（${dup.id}），请改为编辑该条或另选等级`, 'err');

  const data = {
    src, srcEn: g('pf_srcEn') || '', srcOrg: g('pf_org') || '—', srcType: g('pf_type') || '企业认证',
    region: g('pf_region') || '其他',
    batch, doc: bd ? bd.doc : '—', docDate: bd ? bd.date : '2026-10-29',
    tgt, tgtCode: g('pf_code') || '待补录', tgtLevel: level,
    socMonths: soc, years: 0, edu: g('pf_edu') || '不限',
    extra: g('pf_extra') || '证书须真实有效，经发证机构官方渠道核验通过',
    basis: g('pf_basis') || '《国家职业技能标准》',
    note: '在本市就业满 6 个月即可申报，不受国籍、户籍限制',
  };

  if(id){
    const p = DB.pairs.find(x=>x.id===id); if(!p) return;
    Object.assign(p, data, {upd:'2026-10-29', owner:'王建国'});
    closeDrawer(); render(); applyPairFilter();
    toast(`${id} 已保存，个人端查询结果同步更新`, 'ok');
  } else {
    const nid = nextId();
    DB.pairs.unshift(Object.assign({id:nid, seq:999, status:'生效', used:0, upd:'2026-10-29', owner:'王建国'}, data));
    closeDrawer(); render(); applyPairFilter();
    toast(`已新增对应关系 ${nid}（${src} → ${tgt} · ${level}）`, 'ok');
  }
};

/* 停用 / 启用 */
ACT.pairToggle = (id)=>{
  const p = DB.pairs.find(x=>x.id===id); if(!p) return;
  if(p.status==='生效'){
    p.status = '停用';
    p.memo = `${p.upd} 版本条件调整，自 2026-10-29 起停止受理新申请；已受理记录不受影响`;
    p.upd = '2026-10-29';
    toast(`${id} 已停用，不再受理新申请；已受理记录仍按原版本执行`, 'ok');
  } else {
    p.status = '生效';
    p.memo = '';
    p.upd = '2026-10-29';
    toast(`${id} 已重新启用，个人端可再次检索并发起申请`, 'ok');
  }
  render(); applyPairFilter();
};

})();

</script>
<script>
/* ==================================================================
   审批工作台（覆盖 pages-org.js 的 O.review）
   视图：待办（未审批） / 已办（已审批） / 跟踪（审批后流转） / 退回（驳回，可允许再发起）
   + 关键词搜索（申报编号 / 姓名 / 证件号 / 证书编号 / 单位）
   ================================================================== */
(function(){

const TODAY = new Date('2026-10-29T10:00:00');
const TABS = ['todo','done','track','return'];
const GROUP = {
  todo:   ['待核验','核验中'],
  done:   ['核验通过','已导出待接收','人社已读'],
  track:  ['核验通过','已导出待接收','人社已读'],
  return: ['退回补正','不予认定','可重新发起'],
};

/* ---------- 小工具 ---------- */
function days(from){
  const d = new Date(String(from).replace(/-/g,'/').slice(0,10));
  return Math.max(0, Math.round((TODAY - d)/86400000));
}
function hayOf(a){
  return [a.no,a.name,a.idNo,a.srcCert,a.srcNo,a.company,a.tgtJob,a.tgtLevel,a.verifier]
    .join(' ').toLowerCase();
}
function fixCount(a){ return (a.tl||[]).filter(x=>String(x.t).indexOf('退回')>=0).length; }
const kwNow = ()=> String(state.rk||'').trim().toLowerCase();
function socNeed(a){
  const p = DB.pairs.find(x=>x.id===a.pairId);
  return p ? p.socMonths : 36;
}
function socOK(a){ return a.socMonths >= socNeed(a); }
function hit(a){
  const soc = state.rsoc || 'all';
  if(soc==='ok' && !socOK(a)) return false;
  if(soc==='no' && socOK(a)) return false;
  const kw = kwNow(); if(!kw) return true;
  return hayOf(a).indexOf(kw)>=0;
}
function rowsOf(tab){
  /* 跟踪 = 人工标记（a.track），非状态派生：除不予认定外任何状态均可标记跟踪 */
  if(tab==='track') return DB.apps.filter(a=>a.track).filter(hit);
  return DB.apps.filter(a=>GROUP[tab].indexOf(a.status)>=0).filter(hit);
}
function countOf(tab){
  if(tab==='track') return DB.apps.filter(a=>a.track).length;
  return DB.apps.filter(a=>GROUP[tab].indexOf(a.status)>=0).length;
}
/* 列表编号后的跟踪角标 */
const trackMark = a => a.track ? ' <span class="tag cyan" title="已列入跟踪清单">跟踪</span>' : '';

/* ---------- 表格（行带检索键，便于即时过滤；全量渲染，分页/搜索用显隐控制） ---------- */
const RV_PAGE_SIZE = 8;
function rtTable(cols, rows){
  return `<div class="tb-wrap"><table class="tb" id="rvTable">
    <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,i)=>`<tr data-k="${esc(r.k)}" data-i="${i}">${r.c.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>
  <div class="pager" id="rvPager"></div>
  <div class="empty" id="rvEmpty" style="display:none"><div class="em">◍</div>没有匹配的记录，换个关键词试试</div>`;
}

/* ---------- 流程进度 ---------- */
function tprog(a){
  const pass = ['核验通过','已导出待接收','人社已读'].indexOf(a.status)>=0;
  const d2 = a.batch && a.batch!=='—';
  const d3 = !!a.read;
  const n = (on,cur,txt)=>`<span class="tn ${on?'on':''} ${cur?'cur':''}">${txt}</span>`;
  return `<div class="tprog">${n(pass,false,'核验通过')}<i class="${d2?'on':''}"></i>${n(d2,!d2&&pass,'导出报送')}<i class="${d3?'on':''}"></i>${n(d3,!d2&&pass,'人社已读')}</div>`;
}

/* ---------- 页面 ---------- */
PAGES.org.review = function(){
  let t = tabState.reviewTab;
  if(TABS.indexOf(t)<0) t = 'todo';
  const todo = countOf('todo'), done = countOf('done'), ret = countOf('return');
  const rows = rowsOf(t);
  const kw = esc(state.rk||'');

  let head = '', cols = [], body = [];

  if(t==='todo'){
    cols = ['申报编号','申请人 / 单位','原证书','拟认定职业（等级）','社保月数','提交时间','已等待','操作'];
    body = rows.map(a=>{
      const d = days(a.submit), over = d>7;
      return {k: hayOf(a), c: [
        `<span class="link" data-act="openApp" data-v="${a.no}">${a.no}</span>${trackMark(a)}`,
        `<b class="nw">${esc(a.name)}</b><br><span class="mini">${esc(a.company)}</span>`,
        `<span class="mini">${esc(a.srcCert)}</span><br><span class="mini" style="color:#8A9AAC">${esc(a.srcNo)}</span>`,
        `${esc(a.tgtJob)}<br><span class="mini">${esc(a.tgtLevel)}</span>`,
        `<span style="color:${socOK(a)?'#0B7A55':'#C62A2A'};font-weight:600">${a.socMonths}</span> 个月<span class="mini"> / 需 ${socNeed(a)}</span>`,
        `<span class="mini">${esc(a.submit)}</span>`,
        `<span class="${over?'sla-over':'mini'}">${d} 天${over?' · 超期':''}</span>`,
        `<div class="ops"><button class="btn sm" data-act="openApp" data-v="${a.no}">详情</button>
          <button class="btn sm primary" data-act="openApp" data-v="${a.no}">核验</button></div>`
      ]};
    });
    head = '';
  }

  if(t==='done'){
    cols = ['申报编号','申请人','拟认定职业（等级）','核验结论','核验人 / 时间','后续状态','人社','操作'];
    body = rows.map(a=>({k: hayOf(a), c: [
      `<span class="link" data-act="openApp" data-v="${a.no}">${a.no}</span>${trackMark(a)}`,
      `<b class="nw">${esc(a.name)}</b><br><span class="mini">${esc(a.company)}</span>`,
      `${esc(a.tgtJob)}<br><span class="mini">${esc(a.tgtLevel)}</span>`,
      a.status==='核验通过' ? tag('核验通过','green') : '<span class="mini">—（历史结论）</span>',
      `<span class="mini">${esc(a.verifier)} · ${esc(a.verifyAt)}</span>`,
      statusTag(a.status),
      a.batch==='—' ? '<span class="mini">—</span>' : readTag(a.read),
      `<div class="ops"><button class="btn sm" data-act="openApp" data-v="${a.no}">详情</button></div>`
    ]}));
    head = '';
  }

  if(t==='track'){
    cols = ['申报编号','申请人','拟认定职业（等级）','当前状态','核验结论 / 时间','导出批次','流程进度','操作'];
    body = rows.map(a=>({k: hayOf(a), c: [
      `<span class="link" data-act="openApp" data-v="${a.no}">${a.no}</span>${trackMark(a)}`,
      `<b class="nw">${esc(a.name)}</b><br><span class="mini">${esc(a.company)}</span>`,
      `${esc(a.tgtJob)}<br><span class="mini">${esc(a.tgtLevel)}</span>`,
      statusTag(a.status),
      a.verifyAt && a.verifyAt!=='—' ? `<span class="mini">${esc(a.verifier)} · ${esc(a.verifyAt)}</span>` : '<span class="mini">尚未出结论</span>',
      a.batch==='—' ? '<span class="mini">待生成</span>' : mono(a.batch),
      tprog(a),
      `<div class="ops"><button class="btn sm" data-act="openApp" data-v="${a.no}">详情</button>
        ${a.batch==='—'&&a.status==='核验通过'?`<button class="btn sm primary" data-act="nav" data-v="sync">去导出</button>`:''}
        <button class="btn sm" data-act="markTrack" data-v="${a.no}">取消跟踪</button></div>`
    ]}));
    head = `<div class="box info" style="margin:0 0 12px">
      <b>跟踪 = 人工标记</b>：审批时点「标记跟踪」的记录汇集于此，<b>除「不予认定」外任何状态都可跟踪</b>——
      待核验、退回补正、核验通过、已报送、人社已读均可；已通过记录的流程走向为：核验通过 → 导出报送人社 → 人社接收并标记已读，任一步停滞可在「数据同步人社」页处理。</div>`;
  }

  if(t==='return'){
    cols = ['申报编号','申请人','拟认定职业（等级）','退回 / 驳回原因','处理时间','补正次数','当前状态','操作'];
    body = rows.map(a=>{
      const refuse  = a.status==='不予认定';          // 终态：个人端不可再发起
      const opened  = a.status==='可重新发起';        // 已破例开通重新提交入口
      const selfOK  = a.status==='退回补正' && canFixResubmit(a);  // 个人端可在补正期内自行补正重提
      let op;
      if(refuse){
        op = `<div class="ops"><span class="mini" style="color:#C62A2A">终态 · 个人端不可再发起</span>
              <button class="btn sm" data-act="openApp" data-v="${a.no}">详情</button></div>`;
      } else if(opened){
        op = `<div class="ops"><span class="mini" style="color:#0E9F6E">已开通，等待个人提交</span>
              <button class="btn sm" data-act="openApp" data-v="${a.no}">详情</button></div>`;
      } else if(selfOK){
        op = `<div class="ops"><span class="mini">个人端可自行补正重提</span>
              <button class="btn sm" data-act="openApp" data-v="${a.no}">详情</button>
              <button class="btn sm" data-act="reopenApp" data-v="${a.no}">破例开通</button></div>`;
      } else {
        op = `<div class="ops"><span class="mini" style="color:#C62A2A">${esc(fixOverdue(a)?'补正已逾期':'补正次数用尽')}</span>
              <button class="btn sm" data-act="openApp" data-v="${a.no}">详情</button>
              <button class="btn sm primary" data-act="reopenApp" data-v="${a.no}">破例开通再发起</button></div>`;
      }
      return {k: hayOf(a), c: [
        `<span class="link" data-act="openApp" data-v="${a.no}">${a.no}</span>${trackMark(a)}`,
        `<b class="nw">${esc(a.name)}</b><br><span class="mini">${esc(a.company)}</span>`,
        `${esc(a.tgtJob)}<br><span class="mini">${esc(a.tgtLevel)}</span>`,
        `<span class="mini">${esc(a.memo||'材料不齐，需补充后重新提交')}</span>`,
        `<span class="mini">${esc(a.verifyAt)}</span>`,
        refuse ? '<span class="mini">—</span>' : `<b>${fixSubmitTimes(a)}</b> / ${FIX_LIMIT} 次`,
        statusTag(a.status),
        op
      ]};
    });
    head = `<div class="box warn" style="margin:0 0 12px">
      <b>「退回补正」与「不予认定」的再发起口径不同：</b><br>
      · <b>退回补正</b>（材料问题）—— <b>允许个人端再发起</b>：个人在补正期限（15 日）内、${FIX_LIMIT} 次机会内可自行补充材料重新提交，
      沿用原编号、轨迹保留，状态回到「待核验」，无需外服再审批；逾期或次数用尽的，才由外服点「破例开通」。<br>
      · <b>不予认定</b>（结论性否定 —— 证书不实 / 条件不符 / 对应关系停用）—— <b>属终态，不允许个人端再发起</b>，原记录只可查询、不复用；
      个人如已具备条件，只能<b>重新提交一份新的申请</b>。
    </div>`;
  }

  return `
  <div class="page-head"><div class="crumb">上海外服 / 审批工作台</div><h1>审批工作台</h1>
    <p>待核验队列 · 待办未审批 / 已办已审批 / 跟踪已审批流程 / 退回并可允许个人再发起</p></div>

  <div class="card"><div class="card-h">
      <h3>审批队列</h3><span class="sub">共 ${countOf(t)} 条</span>
      <div class="right"><button class="btn sm" data-act="toastDemo" data-msg="已导出当前队列（xlsx）">导出队列</button></div>
    </div>
    <div class="card-b tight" style="padding:0 16px 4px">
      ${pills([
        {k:'todo',t:'待办（未审批）',n:todo},{k:'done',t:'已办（已审批）',n:done},
        {k:'track',t:'跟踪',n:countOf('track')},{k:'return',t:'退回（驳回）',n:ret},
      ], 'reviewTab', t)}

      <div class="qbar">
        <div class="qin">
          <span class="qic">⌕</span>
          <input id="rvSearch" type="text" value="${kw}" placeholder="搜索申报编号 / 姓名 / 证件号 / 证书编号 / 单位" oninput="rvFilter(this)">
          <span class="qx" data-act="rvClear" title="清空">✕</span>
        </div>
        <select onchange="rvSocFilter(this)">
          <option value="all" ${(state.rsoc||'all')==='all'?'selected':''}>社保：全部</option>
          <option value="ok" ${state.rsoc==='ok'?'selected':''}>社保已达标</option>
          <option value="no" ${state.rsoc==='no'?'selected':''}>社保未达标</option>
        </select>
        <span class="qcount">共 <b id="rvCount">${rows.length}</b> 条</span>
        <span class="qhint">支持实时过滤，切换视图不丢失关键词</span>
      </div>

      ${head}
      ${rows.length ? rtTable(cols, body) : empty('当前视图暂无记录')}
    </div>
  </div>

  <div class="box grey" style="margin-top:14px">
    <b>操作口径：</b>① 待办 = 未出结论（待核验 / 核验中），SLA 5 个工作日，超期在「已等待」列标红；
    ② 已办 = 已出结论且结论为通过；③ <b>跟踪 = 人工标记</b>：详情抽屉点「标记跟踪」即纳入跟踪清单
    （<b>除不予认定外任何状态均可</b>），编号旁显示青色「跟踪」角标，用于持续关注办理进展；
    ④ 退回 = <b>退回补正允许个人端再发起</b>（补正期 15 日、限 ${FIX_LIMIT} 次，个人自行补正后重提，沿用原编号）；
    不予认定属终态，<b>不允许</b>个人端再发起，个人只能重新提交新申请。</div>`;
};

/* ---------- 交互 ---------- */
/* 统一视图应用：关键词过滤（DOM 级，不重渲染不丢焦点） × 分页（显隐控制）叠加 */
function applyRvView(){
  const tb = document.getElementById('rvTable'); if(!tb) return;
  const kw = String(state.rk||'').trim().toLowerCase();
  const trs = Array.prototype.slice.call(tb.querySelectorAll('tbody tr'));
  const hits = trs.filter(tr => !kw || (tr.dataset.k||'').indexOf(kw)>=0);
  const pages = Math.max(1, Math.ceil(hits.length / RV_PAGE_SIZE));
  const cur = Math.min(Math.max(1, state.rpage||1), pages);
  state.rpage = cur;
  const start = (cur-1)*RV_PAGE_SIZE;
  const inPage = new Set(hits.slice(start, start+RV_PAGE_SIZE));
  trs.forEach(tr=>{ tr.style.display = inPage.has(tr) ? '' : 'none'; });

  const c = document.getElementById('rvCount'); if(c) c.textContent = hits.length;
  const e = document.getElementById('rvEmpty'); if(e) e.style.display = hits.length ? 'none' : '';
  const w = tb.closest('.tb-wrap'); if(w) w.style.display = trs.length ? '' : 'none';

  const pg = document.getElementById('rvPager');
  if(pg){
    if(hits.length <= RV_PAGE_SIZE){ pg.style.display = 'none'; pg.innerHTML = ''; }
    else { pg.style.display = ''; pg.innerHTML = rvPagerHTML(cur, pages, hits.length); }
  }
}
function rvPagerHTML(cur, pages, total){
  let nums = '';
  for(let i=1;i<=pages;i++) nums += `<button class="pg ${i===cur?'on':''}" onclick="rvPage(${i})">${i}</button>`;
  return `<span class="pg-info">共 ${total} 条 · 每页 ${RV_PAGE_SIZE} 条 · 第 ${cur} / ${pages} 页</span>
    <button class="pg" ${cur<=1?'disabled':''} onclick="rvPage(${cur-1})">‹ 上一页</button>${nums}
    <button class="pg" ${cur>=pages?'disabled':''} onclick="rvPage(${cur+1})">下一页 ›</button>`;
}

/* 我的证书 → 目录对应关系（未列出的证书即目录中暂无对应关系） */
const MY_CERT_PAIR = {
  'HCIA-DATACOM-2024-088412': 'MP-003',   /* HCIA-Datacom → 信息通信网络运行管理员 三级 */
  'HCIA-SEC-2025-339012':     'MP-002',   /* HCIA-Security → 网络与信息安全管理员 三级 */
  'HCIA-DATACOM-2023-115028': 'MP-003',   /* 旧证（已过期）→ 同型号对应关系 */
};

const EDU_RANK = {'不限':0,'初中':1,'高中':2,'中专':3,'大专':4,'本科':5,'硕士':6,'博士':7};
const EDU_REQ  = {'不限':0,'初中及以上':1,'高中及以上':2,'中专及以上':3,'大专及以上':4,'本科及以上':5,'硕士及以上':6};

function eduOK(mine, req){
  const r = EDU_REQ[req]; if(r===undefined) return true;
  return (EDU_RANK[mine]||0) >= r;
}
function certYears(cert){
  if(!cert) return null;
  const d = new Date(cert.date), now = new Date('2026-10-29');
  if(isNaN(d.getTime())) return null;
  return Math.max(0, Math.floor((now-d)/(365*24*3600*1000)));
}
function isExpired(cert){
  if(!cert) return false;
  const d = new Date(cert.validTo);
  if(isNaN(d.getTime())) return false;
  return d < new Date('2026-10-29');
}

/* ---------- 证书文本匹配：支持手工输入的证书名称 / 编号 ---------- */
function normStr(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[（(][^）)]*[）)]/g,'')
    .replace(/[\s\-_·,，.、/\\|:：'"]/g,'');
}
function matchPairByText(text){
  const t = normStr(text); if(!t) return null;
  let best=null, score=0;
  DB.pairs.forEach(p=>{
    const s = normStr(p.src), k = normStr(p.srcKey||'');
    let sc = 0;
    if(k && k===t) sc = 100;                                          // 精确命中型号全名（含星级等限定）
    else if(s && s===t) sc = 100;
    else if(k && (k.indexOf(t)>=0 || t.indexOf(k)>=0)) sc = 88;
    else if(s && (s.indexOf(t)>=0 || t.indexOf(s)>=0)) sc = 82;
    else {
      const raw = String(p.src).toLowerCase();
      const key = normStr(raw.split(/[\s\-_（(]+/)[0] || '');          // 型号代码：hcia / az104 / cka / pmp / aws
      const toks = raw.split(/[\s\-_（）()·,，./–]+/).filter(x=>x.length>=3).map(normStr);
      const hits = toks.filter(k=>t.indexOf(k)>=0).length;
      const keyHit = key && key.length>=2 && t.indexOf(key)>=0;
      if(key && t===key) sc = 95;                                     // 只输型号代码
      else if(keyHit && hits>=1) sc = 50 + hits*10;                   // 型号代码 + 至少一个实词
      else if(key && key.length>=4 && t.indexOf(key)===0 && hits>=1) sc = 60 + hits*10;
    }
    if(sc>score){ score=sc; best=p; }
  });
  return score>=45 ? best : null;
}
function findMyCert(text){
  const t = String(text||'').trim(); if(!t) return null;
  const n = normStr(t), u = t.toUpperCase();
  return DB.myCerts.find(c=>String(c.no).toUpperCase()===u)
      || DB.myCerts.find(c=>String(c.no).toUpperCase().indexOf(u)>=0)
      || DB.myCerts.find(c=>normStr(c.name)===n)
      || DB.myCerts.find(c=>{ const cn=normStr(c.name); return cn && (cn.indexOf(n)>=0 || n.indexOf(cn)>=0); })
      || null;
}
/* 证书 → 目录对应关系：先查已确认映射，再用名称模糊匹配 */
function certPairOf(cert){
  if(!cert) return null;
  return DB.pairs.find(p=>p.id===MY_CERT_PAIR[cert.no]) || matchPairByText(cert.name);
}

/* ---------- 证书输入框：既可下拉选择，也可手工输入 ---------- */
function comboOptions(){
  const mine = DB.myCerts.map(c=>({kind:'mine', label:c.name, sub:`${c.org} · ${c.no}`, no:c.no, pair:certPairOf(c)}));
  const mineNames = DB.myCerts.map(c=>normStr(c.name));
  const others = DB.pairs.filter(p=>p.status==='生效' && mineNames.indexOf(normStr(p.src))<0)
    .map(p=>({kind:'pair', label:p.src, sub:`${p.srcOrg} · 可免试申领 ${p.tgt}（${p.tgtLevel}）`, no:'', pair:p}));

}

      <span class="co-tag ${it.kind}">${it.kind==='mine'?'我已持有':'目录型号'}</span></div>`;
  };
  return `<div class="combo" id="${id}_w">
    <input class="combo-in" id="${id}" autocomplete="off" value="${esc(value||'')}"
      placeholder="${esc(opts.ph||'输入证书名称或证书编号，也可点右下拉选择')}" data-pair="${opts.pair||''}">
    <span class="combo-ic">▼</span>
    <div class="combo-pop">
      <div class="combo-grp" data-g="mine">我已持有的证书（${g.mine.length}）</div>
      ${g.mine.map(opt).join('')}
      <div class="combo-grp" data-g="pair">《免试对应目录》收录的其他证书型号（${g.others.length}）</div>
      ${g.others.map(opt).join('')}
      <div class="combo-empty" style="display:none">目录中未收录该证书型号。<br>可直接<b>手工输入</b>后提交，由上海外服在核验环节人工评估（办理周期略长）。</div>
    </div>
  </div>`;
}
function filterCombo(inp){
  const w = inp.closest('.combo'); if(!w) return;
  const kw = normStr(inp.value), raw = inp.value.toLowerCase().trim();
  /* 长句输入时拆词：英文/数字段 + 中文前缀，任一命中即显示 */
  const toks = (raw.match(/[a-z0-9]+/gi)||[]).map(normStr).filter(x=>x.length>=2);
  if(kw.length>4) toks.push(kw.slice(0,4));
  if(kw.length>2) toks.push(kw.slice(0,2));
  let shown = 0; const grp = {};
  w.querySelectorAll('.combo-opt').forEach(o=>{
    const t = normStr(o.dataset.t);
    let hit = !kw || t.indexOf(kw)>=0 || kw.indexOf(t)>=0 || o.dataset.t.toLowerCase().indexOf(raw)>=0;
    if(!hit) hit = toks.some(k=>k && t.indexOf(k)>=0);
    o.classList.toggle('hide', !hit);
    if(hit){ shown++; grp[o.dataset.g] = (grp[o.dataset.g]||0)+1; }
  });
  w.querySelectorAll('.combo-grp').forEach(g=>{ g.style.display = grp[g.dataset.g] ? '' : 'none'; });
  const emp = w.querySelector('.combo-empty');
  if(emp) emp.style.display = shown ? 'none' : 'block';
}

/* 查询动作：支持下拉选中，也支持手工输入证书名称 / 编号 */
ACT.runQuery = (tab)=>{
  const socEl = document.getElementById('qSoc');
  const soc = Number(socEl?socEl.value:0)||0;
  const eduEl = document.getElementById('qEdu');
  const edu = eduEl ? eduEl.value : DB.me.edu;
  if(tab==='cert'){
    const inp = document.getElementById('qCert');
    const text = (inp && inp.value || '').trim();
    if(!text) return toast('请输入或选择您持有的证书', 'err');
    const cert = findMyCert(text);
    const pair = (inp.dataset.pair && DB.pairs.find(p=>p.id===inp.dataset.pair))
              || certPairOf(cert) || matchPairByText(text);
    state.q = {certText:text, certName: cert ? cert.name : text, certNo: cert ? cert.no : '',
               pairId: pair ? pair.id : null, soc, edu};
  } else {
    const jobSel = document.getElementById('qJob');
    state.q = {job: jobSel.value, soc, edu};
  }
  render();
  toast('查询完成', 'ok');
};

ACT.pickApply = (name, el)=>{
  const cert = findMyCert(name);
  if(cert && cert.verified===false)
    return toast('该证书仍在上海外服核验中，核验通过后方可发起免试申请', 'err');
  const p = certPairOf(cert);
  if(cert && (!p || p.status!=='生效'))
    return toast('该证书型号在《免试对应目录》中暂无生效的对应关系，无法发起免试申请', 'err');
  state.applyCert = name || '';
  go('person','pApply');
};
ACT.submitApply = ()=>{
  const no = 'MS2026100029';
  if(DB.apps.some(a=>a.no===no)) return toast('该申请已提交，请勿重复提交', 'err');
  const inp = document.getElementById('applyCert');
  const name = (inp && inp.value || state.applyCert || '').trim();

    tgtJob: p?p.tgt:'待人工评估', tgtLevel: p?p.tgtLevel:'—', pairId: p?p.id:'',

<script>
/* ==================== 个人 · 我的证书 ====================
   1) 证书保存到本地（localStorage，下次打开自动恢复）
   2) 判断该证书在《免试对应目录》里有没有 1 对 1 的另一个证书
      —— 有：可关联发起免试申请；没有：提示"暂无可免试的对应证书"，可申请纳入评估
   ================================================================== */
(function(){
  const P = PAGES.person;

  /* ---------- 本地存储 ---------- */
  const LS_KEY = 'skillcert.certs.v1';
  const LS = (typeof localStorage !== 'undefined') ? localStorage : null;
  let savedAt = '';
  function stamp(){
    const d = new Date(), p = n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function persist(){
    savedAt = stamp();
    if(!LS) return;
    try{ LS.setItem(LS_KEY, JSON.stringify({at:savedAt, list:DB.myCerts})); }catch(e){}
  }
  (function restore(){
    if(!LS) return;
    try{
      const o = JSON.parse(LS.getItem(LS_KEY) || 'null');
      if(o && Array.isArray(o.list) && o.list.length){ DB.myCerts = o.list; savedAt = o.at || ''; }
    }catch(e){}
  })();
  if(!savedAt) persist();   // 首次进入：把预置证书也落一份到本机

  /* ---------- 匹配判定：目录里是否有"另一个证书" ---------- */
  function matchInfo(c){
    const p = certPairOf(c);
    if(!p) return {st:'none'};                       // 目录未收录该型号
    if(p.status!=='生效') return {st:'off', p};      // 收录过但对应关系已停用
    return {st:'on', p};                             // 有生效的 1 对 1 对应关系
  }
  const stName = st => st==='on' ? '可免试' : st==='off' ? '对应关系已停用' : '暂无对应证书';

  /* ---------- 我的证书 ---------- */
  P.pCerts = ()=>{
    const mine = DB.myCerts;
    const pend = mine.filter(c=>c.verified===false);
    const canGo = mine.filter(c=>matchInfo(c).st==='on' && !isExpired(c) && c.verified!==false);
    const noPair = mine.filter(c=>matchInfo(c).st!=='on').length;
    const expCnt = mine.filter(c=>matchInfo(c).st==='on' && isExpired(c)).length;
    const pendCnt = mine.filter(c=>matchInfo(c).st==='on' && !isExpired(c) && c.verified===false).length;

    return `
    <div class="page-head"><div class="crumb">个人中心 / 我的证书</div><h1>我的证书</h1>
      <p>证书先保存到本地（本机浏览器），再提交上海外服核验；能否免试换另一个证，取决于外服是否在《免试对应目录》里建立了 1 对 1 的对应关系</p></div>

    <div class="grid g4" style="margin-bottom:14px">
      ${stat('已保存的证书', mine.length, '保存在本机，可随时发起申请', '⌘', '#14539A')}
      ${stat('已核验', mine.filter(c=>c.verified!==false).length, pend.length?`${pend.length} 张待外服核验`:'全部已核验', '✓', '#0E9F6E')}
      ${stat('可免试换证', canGo.length, '目录有对应关系且证书有效', '⇄', '#0B7EA8')}
      ${stat('暂不可换证', mine.length-canGo.length, `无对应 ${noPair} · 过期 ${expCnt} · 待核验 ${pendCnt}`, '∅', mine.length-canGo.length?'#A5660A':'#8A9AAD')}
    </div>

    <div class="ls-bar">
      <div class="ls-ic">⤓</div>
      <div class="ls-tx">
        <b>证书已保存到本地</b>　共 ${mine.length} 张 · 最近保存 ${savedAt||'—'}
        <div class="mini">保存在本机浏览器，换设备需重新录入；如需重新演示预置数据，可清空本地数据。</div>
      </div>
      <button class="btn sm" data-act="resetCerts">清空本地数据</button>
      <button class="btn sm primary" data-act="addCertDrawer" data-v="">+ 添加证书</button>
    </div>

    ${card('我持有的原证书', mine.length ? `<div class="cc-list">

        } else if(mi.st==='off'){
          line = `<div class="cc-x no">∅ 原本对应「${esc(p.tgt)} · ${esc(p.tgtLevel)}」，但该对应关系已于 ${esc(p.upd)} 停用，暂不可发起</div>`;

        } else {

          note = '不是所有证书都有可换的另一个证——目录由上海外服按 1 对 1 维护，未收录的可申请纳入评估';
        }

        return `<div class="cc">
          <div class="cc-ic" style="background:${pend2?'#FDF3E3':'linear-gradient(135deg,#EAF1FA,#D4E4F6)'};color:${pend2?'#A5660A':'#14539A'}">${pend2?'⌛':mi.st==='on'?'⇄':'⌘'}</div>
          <div class="cc-bd">
            <div class="cc-t">${esc(c.name)}</div>

            ${line}

          </div>
          <div class="cc-ac">
            <div class="cc-tags">
              ${pend2?tag('待外服核验','orange'):tag('已核验','green')}
              ${exp?tag('已过期','grey'):tag('有效','green')}
              ${mi.st==='on'?tag('目录已匹配','blue'):tag('无对应证书','grey')}
              ${c.pairReq?tag('已申请纳入评估','orange'):''}
            </div>
            <div class="cc-btns">
              ${canApply?`<button class="btn sm primary" data-act="pickApply" data-v="${esc(c.name)}">→ 发起免试认证</button>`:''}
              <button class="btn sm" data-act="certMatch" data-v="${esc(c.no)}">匹配情况</button>
              ${mi.st!=='on'&&!c.pairReq?`<button class="btn sm" data-act="requestPair" data-v="${esc(c.no)}">申请纳入目录</button>`:''}

      {sub:`共 ${mine.length} 张`, right:`<span class="mini">保存即在本机留存，刷新不丢</span>`})}

    ${card('《免试对应目录》收录的证书型号', `
      <div class="mini" style="margin-bottom:10px">下表由上海外服维护。<b>只有状态为「生效」的对应关系</b>，个人才能用自己的证书发起免试申请；停用的不再受理。</div>
      ${table(['源证书型号','可免试换取的证书','免试条件','对应关系','我是否持有','最近更新'],
        DB.pairs.map(p=>{

            `${esc(p.tgt)} · ${esc(p.tgtLevel)}<br><span class="mini">职业编码 ${esc(p.tgtCode)}</span>`,
            `<span class="mini">社保 ${p.socMonths} 个月 · 持证 ${p.years?p.years+' 年':'不限'} · ${esc(p.edu)}</span>`,
            statusTag(p.status),
            own?tag('已持有','green'):'<span class="mini">—</span>',
            `<span class="mini">${esc(p.upd)}</span>` ];
        }), {tight:true})}
      <div class="box grey" style="margin-top:10px;font-size:12.5px">

    ${card('已获得的职业技能等级证书', DB.myGranted.length ? DB.myGranted.map(g=>
